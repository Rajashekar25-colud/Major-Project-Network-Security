# =====================================================================
# AI-Based Network Attack Forecasting from Network Traffic Data
# Central configuration. Nothing dataset-specific is hard-coded in code:
# column aliases, label->ATT&CK mapping, windowing, model, thresholds,
# warning-engine behaviour and split strategy all live here.
# =====================================================================
project:
  name: "AI Based Network Attack Forecasting"
  version: "2.0.0"
  preprocessing_version: "2.0"     # bump when feature definitions change

seed: 42

window:
  seconds: 10               # length of one time window (network state)
  sequence_length: 12       # past windows fed to the model (12 x 10 s = 2 min)
  forecast_horizon: 6       # future windows forecast (6 x 10 s = 1 min)
  max_gap_windows: 6        # gaps <= this many empty windows are zero-filled;
                            # longer gaps split the stream into segments
  min_segment_windows: auto # drop isolated fragments shorter than L+H+1 windows (cannot form a sample)
  min_windows: 60           # refuse to train on fewer windows than this

labeling:
  # A window is an "attack window" when attack flows are BOTH >= min_attack_flows
  # and >= min_attack_fraction of all flows in that window.
  min_attack_flows: 3
  min_attack_fraction: 0.01
  unknown_attack_stage: "Initial Access"   # used (and reported) for unmapped attack labels

split:
  strategy: "blocked"             # blocked | day_chronological | chronological
  # blocked: every capture day is cut into time blocks that are assigned to
  #   train / val / test in a repeating pattern (T=train V=val E=test). Samples never
  #   straddle two blocks, so no window is shared between splits. This keeps every
  #   attack type visible to training; the price is that test blocks sit next to
  #   train blocks of the SAME campaign (within-campaign generalisation, not new campaigns).
  block_windows: 90               # max block length (shrunk automatically for short days)
  block_pattern: "TTTVTTTETE"     # 70% train / 10% val / 20% test
  # day_chronological / chronological use these fractions instead:
  train_fraction: 0.70
  val_fraction: 0.10

model:
  hidden_size: 128
  layers: 2
  dropout: 0.30
  attention_heads: 4
  learning_rate: 0.0005
  weight_decay: 0.0001
  input_noise: 0.10          # gaussian noise (std, in standardised units) added to training inputs
  epochs: 30
  batch_size: 128
  early_stopping_patience: 6
  grad_clip: 1.0
  state_loss_weight: 0.30
  stage_loss_weight: 0.70
  attack_loss_weight: 1.00
  max_train_samples_per_epoch: 200000   # random subsample per epoch (keeps CPU epochs short)
  feature_clip: 10.0

calibration:
  # Warning threshold is CHOSEN on the validation split, not hard-coded:
  # maximise recall subject to onset-FPR <= target (falls back to best F1).
  target_false_positive_rate: 0.05
  fallback_threshold: 0.50

warning:
  # Severity is derived from the forecast risk (max attack probability over the horizon)
  # relative to the calibrated threshold.
  watch_ratio: 0.70          # risk >= watch_ratio*thr           -> WATCH
  critical_margin: 0.5       # risk >= thr + margin*(1-thr)      -> CRITICAL
  persistence_windows: 2     # consecutive windows above thr before an alert opens
  clear_ratio: 0.80          # hysteresis: alert stays open until risk < clear_ratio*thr ...
  clear_windows: 3           # ... for this many consecutive windows
  cooldown_windows: 6        # after an alert closes, same-stage re-alerts are suppressed
  lookback_windows: null     # qualifying-warning look-back for lead time (null = horizon)

inference:
  top_features: 10

# ---------------------------------------------------------------------
# Column aliases (case/punctuation-insensitive). IP / source-port columns
# are OPTIONAL: the processed CSE-CIC-IDS2018 CSVs mostly lack them.
# ---------------------------------------------------------------------
columns:
  timestamp:   [Timestamp, timestamp, time, Time, Date, ts, start_time, Flow Start Time]
  src_ip:      [Src IP, src_ip, Source IP, source_ip, srcip, sa]
  dst_ip:      [Dst IP, dst_ip, Destination IP, destination_ip, dstip, da]
  src_port:    [Src Port, src_port, Source Port, source_port, sport]
  dst_port:    [Dst Port, dst_port, Destination Port, destination_port, dport, Destination Port Number]
  protocol:    [Protocol, protocol, proto, IP Protocol, ip_proto]
  label:       [Label, label, attack, Attack, attack_cat, category, Category, class, Class]
  flow_duration: [Flow Duration, flow_duration, duration, Duration, dur]
  fwd_packets: [Tot Fwd Pkts, Total Fwd Packets, fwd_packets, total_fwd_packets, spkts]
  bwd_packets: [Tot Bwd Pkts, Total Backward Packets, bwd_packets, total_bwd_packets, dpkts]
  fwd_bytes:   [TotLen Fwd Pkts, Total Length of Fwd Packets, fwd_bytes, total_fwd_bytes, sbytes]
  bwd_bytes:   [TotLen Bwd Pkts, Total Length of Bwd Packets, bwd_bytes, total_bwd_bytes, dbytes]
  iat_mean:    [Flow IAT Mean, flow_iat_mean, iat_mean]
  iat_std:     [Flow IAT Std, flow_iat_std, iat_std]
  iat_max:     [Flow IAT Max, flow_iat_max, iat_max]
  ttl:         [TTL, ttl, ttl_mean, sttl]
  win_fwd:     [Init Fwd Win Byts, Init_Win_bytes_forward, swin, tcp_window, TCP Window Size, window_size]
  win_bwd:     [Init Bwd Win Byts, Init_Win_bytes_backward, dwin]
  retransmissions: [Retransmission Count, retransmissions, retransmission_count, sloss]
  pktlen_mean: [Pkt Len Mean, Packet Length Mean, pkt_len_mean]
  pktlen_std:  [Pkt Len Std, Packet Length Std, pkt_len_std]
  syn:         [SYN Flag Cnt, SYN Flag Count, syn_count]
  ack:         [ACK Flag Cnt, ACK Flag Count, ack_count]
  rst:         [RST Flag Cnt, RST Flag Count, rst_count]
  fin:         [FIN Flag Cnt, FIN Flag Count, fin_count]
  psh:         [PSH Flag Cnt, PSH Flag Count, psh_count]
  urg:         [URG Flag Cnt, URG Flag Count, urg_count]

# Time units of the source flow CSV. CICFlowMeter uses microseconds.
units:
  duration_divisor: 1000000.0      # source unit -> seconds
  iat_divisor: 1000000.0

# ---------------------------------------------------------------------
# Dataset label -> MITRE ATT&CK tactic. Exact (case-insensitive) match
# first; then regex fallbacks. Review for the dataset version you use.
# ---------------------------------------------------------------------
stage_mapping:
  benign_labels: [benign, normal, "0"]
  exact:
    "ftp-bruteforce": Credential Access
    "ssh-bruteforce": Credential Access
    "brute force -web": Credential Access
    "brute force -xss": Initial Access
    "sql injection": Initial Access
    "infilteration": Lateral Movement      # sic - the dataset spells it this way
    "infiltration": Lateral Movement
    "bot": Command and Control
    "botnet": Command and Control
    "heartbleed": Initial Access
    "portscan": Reconnaissance
    "reconnaissance": Reconnaissance
    "exfiltration": Exfiltration
  regex:
    - ["ddos", Impact]
    - ["dos", Impact]
    - ["brute", Credential Access]
    - ["xss|sql|web attack|exploit", Initial Access]
    - ["infil", Lateral Movement]
    - ["bot", Command and Control]
    - ["scan|recon", Reconnaissance]
    - ["exfil", Exfiltration]

stage_order:
  - Benign
  - Reconnaissance
  - Initial Access
  - Credential Access
  - Discovery
  - Lateral Movement
  - Command and Control
  - Exfiltration
  - Impact

attack_tactics:            # MITRE ATT&CK enterprise tactic IDs (for display)
  Reconnaissance: TA0043
  Initial Access: TA0001
  Credential Access: TA0006
  Discovery: TA0007
  Lateral Movement: TA0008
  Command and Control: TA0011
  Exfiltration: TA0010
  Impact: TA0040

features:
  well_known_ports: [20, 21, 22, 23, 25, 53, 80, 110, 123, 135, 139, 143, 443, 445, 3389, 8080, 8443]
  port_buckets: [20, 21, 22, 23, 25, 53, 80, 110, 123, 135, 139, 143, 443, 445, 3389, 8080, 8443]
  small_flow_max_packets: 3
  rate_clip: 1000000.0
